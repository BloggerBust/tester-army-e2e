name: chromium
description: >-
  Installs Playwright's Chromium and its system packages, with the .deb files
  apt downloads for them restored from and saved to the Actions cache.

# `--with-deps` runs `apt-get update` and then installs about 38 MB of
# packages, both from the Ubuntu mirror, which often serves them at 50 to
# 200 kB/s: the step then takes 2 to 14 minutes instead of 15 seconds. When the
# cache restores the packages, apt installs them from their files and the job
# never reaches the mirror. When that fails, `--with-deps` runs as before, with
# apt reading the restored files, so it downloads only the packages whose
# version changed.
inputs:
  only-shell:
    description: Install only the headless shell, not the full browser.
    default: 'true'

runs:
  using: composite
  steps:
    # The prefix holds what decides the package list: the Ubuntu release and
    # the Playwright version. The suffix is a digest of the .deb file names,
    # so a key names one exact set of package versions.
    # The directory sits under /var/cache, not the runner's temp directory:
    # apt downloads as `_apt`, which cannot traverse /home/runner and would
    # fall back to downloading as root. The runner owns the directory so the
    # cache can restore into it; `partial` belongs to `_apt`, as in
    # /var/cache/apt/archives.
    - name: Point apt at the cached archives
      id: apt
      shell: bash
      env:
        ARCHIVES: /var/cache/chromium-apt
      run: |
        set -euo pipefail
        . /etc/os-release
        PLAYWRIGHT="$(node -p "require('./packages/web/package.json').dependencies['playwright-core']")"
        sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$ARCHIVES"
        sudo install -d -o _apt -g root -m 700 "$ARCHIVES/partial"
        printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' "$ARCHIVES" \
          | sudo tee /etc/apt/apt.conf.d/99chromium-archives > /dev/null
        echo "archives=$ARCHIVES" >> "$GITHUB_OUTPUT"
        echo "prefix=chromium-apt-$ID-$VERSION_ID-$(uname -m)-playwright-$PLAYWRIGHT" >> "$GITHUB_OUTPUT"
    # No entry has exactly this key: restore-keys picks the newest entry with
    # the prefix.
    - name: Restore the archives
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.apt.outputs.archives }}/*.deb
        key: ${{ steps.apt.outputs.prefix }}
        restore-keys: ${{ steps.apt.outputs.prefix }}-
    # Entries saved before the set was pruned to the installed versions can
    # hold two versions of one package; apt takes one file per package.
    - name: Keep the newest version of each package
      shell: bash
      env:
        ARCHIVES: ${{ steps.apt.outputs.archives }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        declare -A newest
        for deb in "$ARCHIVES"/*.deb; do
          read -r pkg version < <(dpkg-deb --show --showformat '${Package}:${Architecture} ${Version}\n' "$deb")
          kept="${newest[$pkg]:-}"
          if [[ -z "$kept" ]]; then
            newest[$pkg]="$version $deb"
          elif dpkg --compare-versions "$version" gt "${kept%% *}"; then
            rm -f "${kept#* }"
            newest[$pkg]="$version $deb"
          else
            rm -f "$deb"
          fi
        done
    # A restored entry holds every package `--with-deps` installed or upgraded
    # on the image that saved it, so apt resolves them
    # against the installed ones with no package lists and nothing to
    # download. On a different image apt may need a downgrade or a removal,
    # which it refuses, and the dry run fails when the image lacks a package
    # Playwright needs; in each case `--with-deps` runs instead. Once the cache
    # installs, nothing is downloaded, so the versions stay those of the saved
    # entry until a fallback saves a new one.
    - name: Install Chromium
      shell: bash
      env:
        ARCHIVES: ${{ steps.apt.outputs.archives }}
        RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
        ONLY_SHELL: ${{ inputs.only-shell == 'true' && '--only-shell' || '' }}
      run: |
        set -euo pipefail
        playwright() { pnpm --filter @e2e-dev/web exec playwright-core "$@"; }
        from_cache() {
          shopt -s nullglob
          local debs=("$ARCHIVES"/*.deb)
          [[ -n "$RESTORED" && ${#debs[@]} -gt 0 ]] || return 1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-download --no-remove --no-install-recommends "${debs[@]}" || return 1
          playwright install-deps --dry-run chromium
        }
        if from_cache; then
          playwright install chromium $ONLY_SHELL
        else
          [[ -z "$RESTORED" ]] || echo "::notice::The cached packages did not cover Playwright's dependencies; installing from the Ubuntu mirror."
          playwright install chromium --with-deps $ONLY_SHELL
        fi
    # Keeps only the files of the installed versions, so a fallback that
    # upgraded a package drops the old file and the set changes only when a
    # package version does.
    - name: Name the archive set
      id: set
      shell: bash
      env:
        ARCHIVES: ${{ steps.apt.outputs.archives }}
        PREFIX: ${{ steps.apt.outputs.prefix }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        INSTALLED="$(dpkg-query -W -f '${db:Status-Abbrev} ${Package}_${Version}_${Architecture}\n' | awk '$1 == "ii" { print $2 }')"
        for deb in "$ARCHIVES"/*.deb; do
          id="$(dpkg-deb --show --showformat '${Package}_${Version}_${Architecture}' "$deb")"
          grep -qxF "$id" <<< "$INSTALLED" || rm -f "$deb"
        done
        DIGEST="$(find "$ARCHIVES" -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)"
        echo "key=$PREFIX-$DIGEST" >> "$GITHUB_OUTPUT"
        echo "count=$(find "$ARCHIVES" -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
    # Jobs of one run that all missed race for the same key; one saves and
    # the others log a warning.
    - name: Save the archives
      if: steps.set.outputs.count != '0' && steps.set.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.apt.outputs.archives }}/*.deb
        key: ${{ steps.set.outputs.key }}
